<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>聯絡我們 | 表演藝術團隊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-gray-900">
    <nav class="fixed top-0 w-full flex justify-between items-center px-6 md:px-12 py-6 z-40 bg-[#f7f7f7]/90">
        <a href="index.html" class="text-xl font-bold serif">LOGO</a>
        <div class="hidden lg:flex space-x-10 text-xs font-bold uppercase text-black">
            <a href="about.html" class="text-gray-500 hover:text-black">關於我們</a>
            <a href="services.html" class="text-gray-500 hover:text-black">服務項目</a>
            <a href="works.html" class="text-gray-500 hover:text-black">作品集</a>
            <a href="events.html" class="text-gray-500 hover:text-black">演出與消息</a>
            <a href="collaborate.html" class="text-gray-500 hover:text-black">合作方式</a>
            <a href="contact.html" class="border-b border-black">聯絡我們</a>
        </div>
    </nav>

    <main class="pt-40 px-6 md:px-12 max-w-7xl mx-auto min-h-screen pb-32">
        <h1 class="text-5xl md:text-6xl serif mb-12 text-gray-900">聯絡我們</h1>
        <div class="grid md:grid-cols-2 gap-16 pt-16">
            <div>
                <h2 class="text-3xl serif mb-8">把想法變成現實</h2>
                <p class="text-gray-600 mb-8">信件將於 1-2 個工作天內由專案經理回覆。[cite: 1]</p>
                <p class="text-sm font-bold">Email: contact@example.com</p>
                <p class="text-sm font-bold mt-2">Tel: 02-1234-5678</p>
            </div>
            <div>
                <form class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold uppercase mb-2">姓名 / 單位</label>
                        <input type="text" class="w-full border-b border-black bg-transparent py-2 outline-none focus:border-gray-400 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-2">聯絡信箱</label>
                        <input type="email" class="w-full border-b border-black bg-transparent py-2 outline-none focus:border-gray-400 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-2">需求描述</label>
                        <textarea rows="4" class="w-full border-b border-black bg-transparent py-2 outline-none focus:border-gray-400 transition"></textarea>
                    </div>
                    <button type="submit" class="px-8 py-3 bg-black text-white text-xs uppercase hover:bg-gray-800 transition">送出表單</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
